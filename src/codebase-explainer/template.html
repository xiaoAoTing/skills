<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@@TITLE@@ - 逻辑解析</title>
  <script>
    document.documentElement.dataset.theme =
      (typeof localStorage !== 'undefined' && localStorage.getItem('theme')) || 'light';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js" crossorigin="anonymous"></script>
  <style>
    :root, [data-theme="light"] {
      --bg-primary: #ffffff; --bg-secondary: #f7f6f3; --bg-tertiary: #f1f1ef;
      --bg-hover: #efefee; --bg-code: #f7f6f3;
      --text-primary: #37352f; --text-secondary: #6b6b6b; --text-tertiary: #9b9a97;
      --border-color: #e8e7e4; --border-light: #f0efec;
      --accent-blue: #2383e2; --accent-red: #eb5757; --accent-green: #0f7b6c;
      --accent-yellow: #d9730d; --accent-purple: #6940a5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --callout-info: #e8f0fe; --callout-warn: #fef7e0; --callout-error: #fde7e7;
      --modal-bg: rgba(15,15,15,0.6); --modal-content-bg: #ffffff;
    }
    [data-theme="dark"] {
      --bg-primary: #191919; --bg-secondary: #202020; --bg-tertiary: #2f2f2f;
      --bg-hover: #383838; --bg-code: #2f2f2f;
      --text-primary: #e8e8e3; --text-secondary: #9b9b9b; --text-tertiary: #6b6b6b;
      --border-color: #383838; --border-light: #2f2f2f;
      --accent-blue: #529cca; --accent-red: #ff7369; --accent-green: #4dab9a;
      --accent-yellow: #ffa344; --accent-purple: #9a6dd7;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2); --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --callout-info: #1a2a3a; --callout-warn: #2a2510; --callout-error: #2a1515;
      --modal-bg: rgba(0,0,0,0.75); --modal-content-bg: #202020;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, "PingFang SC", sans-serif;
      background: var(--bg-primary); color: var(--text-primary);
      line-height: 1.65; transition: background 0.2s, color 0.2s;
      display: flex; min-height: 100vh;
    }

    .sidebar {
      position: sticky; top: 0; width: 220px; min-width: 220px; height: 100vh;
      overflow-y: auto; padding: 24px 12px; border-right: 1px solid var(--border-color);
      font-size: 14px; background: var(--bg-secondary);
    }
    .sidebar a {
      display: block; padding: 4px 8px; color: var(--text-secondary); text-decoration: none;
      border-left: 2px solid transparent; border-radius: 0 4px 4px 0; margin-bottom: 2px;
      transition: all 0.15s;
    }
    .sidebar a:hover { background: var(--bg-hover); color: var(--text-primary); }
    .sidebar a.active { border-left-color: var(--accent-blue); color: var(--accent-blue); background: var(--bg-hover); }
    .sidebar .sub { padding-left: 20px; font-size: 13px; }

    .main { flex: 1; max-width: 900px; margin: 0 auto; padding: 48px 32px; }
    h1 { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
    h2 { font-size: 24px; font-weight: 600; margin: 2em 0 0.5em; }
    h3 { font-size: 20px; font-weight: 600; margin: 1.5em 0 0.5em; }
    p { margin: 0.5em 0; }
    ul, ol { margin: 0.5em 0 0.5em 1.5em; }
    li { margin: 0.25em 0; }

    .answer {
      font-size: 18px; padding: 16px 20px; margin: 24px 0 8px;
      background: var(--bg-secondary); border-left: 3px solid var(--accent-blue); border-radius: 4px;
    }
    .answer strong { color: var(--accent-blue); }

    .callout { padding: 12px 16px; border-radius: 4px; margin: 16px 0; border-left: 3px solid var(--border-color); background: var(--bg-secondary); }
    .callout.info { border-left-color: var(--accent-blue); background: var(--callout-info); }
    .callout.warn { border-left-color: var(--accent-yellow); background: var(--callout-warn); }
    .callout.error { border-left-color: var(--accent-red); background: var(--callout-error); }
    .callout .label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 2px; }

    pre {
      background: var(--bg-code); border-radius: 4px; padding: 16px; overflow-x: auto;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; line-height: 1.5; margin: 12px 0;
    }
    code {
      font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.9em;
      background: var(--bg-code); padding: 2px 5px; border-radius: 3px;
    }
    pre code { background: none; padding: 0; }

    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    th, td { padding: 8px 12px; border: 1px solid var(--border-color); text-align: left; }
    th { background: var(--bg-secondary); font-weight: 600; }

    .figure { margin: 20px 0; }
    .mermaid { width: 100%; cursor: pointer; padding: 12px 0; text-align: center; }
    .mermaid svg { max-width: 100%; height: auto; }
    .caption { text-align: center; font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }

    .ref { font-size: 12px; color: var(--text-tertiary); font-family: "SFMono-Regular", Menlo, Consolas, monospace; }

    .theme-toggle {
      position: fixed; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border-color); background: var(--bg-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 100;
    }
    .theme-toggle:hover { background: var(--bg-hover); box-shadow: var(--shadow-md); }
    [data-theme="light"] .i-dark { display: none; }
    [data-theme="dark"] .i-light { display: none; }

    .modal { display: none; position: fixed; inset: 0; background: var(--modal-bg); z-index: 200; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-close {
      position: fixed; top: 16px; right: 16px; font-size: 28px; color: #fff; cursor: pointer; z-index: 210;
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255,255,255,0.15);
    }
    .modal-close:hover { background: rgba(255,255,255,0.3); }
    .modal-body { background: var(--modal-content-bg); border-radius: 8px; max-width: 95vw; max-height: 90vh; overflow: auto; padding: 32px; }
    .modal-hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px; opacity: 0.6; z-index: 210; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
    <span class="i-light">🌙</span><span class="i-dark">☀️</span>
  </button>

  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
@@CONTENT@@
  </main>

  <div class="modal" id="modal">
    <div class="modal-close" id="modalClose">&times;</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-hint">滚轮缩放 · 拖拽平移 · Esc 关闭</div>
  </div>

  <script>
    const root = document.documentElement;
    const diagrams = [...document.querySelectorAll('.mermaid')];
    const sources = diagrams.map(el => el.textContent.trim());

    function boot() {
      mermaid.initialize({
        startOnLoad: false,
        theme: root.dataset.theme === 'dark' ? 'dark' : 'default',
        securityLevel: 'loose',
        flowchart: { useMaxWidth: false, htmlLabels: true, padding: 16 },
        sequence: { useMaxWidth: false, diagramMarginX: 40, diagramMarginY: 10 }
      });
      diagrams.forEach((el, i) => {
        el.removeAttribute('data-processed');
        el.innerHTML = '';
        mermaid.render('m' + i + '-' + Date.now(), sources[i])
          .then(({ svg }) => { el.innerHTML = svg; })
          .catch(e => { el.innerHTML = '<pre style="color:var(--accent-red);text-align:left">图表渲染失败: ' + e.message + '\n\n' + sources[i] + '</pre>'; });
      });
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', root.dataset.theme);
      boot();
    });
    boot();

    const sidebar = document.getElementById('sidebar');
    const heads = [...document.querySelectorAll('.main h2, .main h3')];
    heads.forEach((h, i) => {
      h.id = 's' + i;
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      if (h.tagName === 'H3') a.classList.add('sub');
      sidebar.appendChild(a);
    });
    const obs = new IntersectionObserver(es => {
      es.forEach(e => {
        const link = sidebar.querySelector('a[href="#' + e.target.id + '"]');
        if (link) link.classList.toggle('active', e.isIntersecting);
      });
    }, { rootMargin: '-20% 0px -60% 0px' });
    heads.forEach(h => obs.observe(h));

    const modal = document.getElementById('modal');
    const modalBody = document.getElementById('modalBody');
    let scale = 1, px = 0, py = 0, drag = false, lx, ly;
    const apply = () => {
      const svg = modalBody.querySelector('svg');
      if (svg) svg.style.transform = `translate(${px}px, ${py}px) scale(${scale})`;
    };
    diagrams.forEach(el => el.addEventListener('click', () => {
      const svg = el.querySelector('svg');
      if (!svg) return;
      modalBody.innerHTML = '';
      modalBody.appendChild(svg.cloneNode(true));
      scale = 1; px = 0; py = 0; apply();
      modal.classList.add('open');
    }));
    const close = () => modal.classList.remove('open');
    document.getElementById('modalClose').addEventListener('click', close);
    modal.addEventListener('click', e => { if (e.target === modal) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    modalBody.addEventListener('wheel', e => {
      e.preventDefault();
      scale = Math.max(0.5, Math.min(5, scale + (e.deltaY > 0 ? -0.15 : 0.15)));
      apply();
    }, { passive: false });
    modalBody.addEventListener('mousedown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
    document.addEventListener('mousemove', e => {
      if (!drag) return;
      px += e.clientX - lx; py += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply();
    });
    document.addEventListener('mouseup', () => { drag = false; });
  </script>
</body>
</html>
